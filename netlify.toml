[build]
  command = "git clone --depth 1 -b stable https://github.com/flutter/flutter.git /tmp/flutter && export PATH=/tmp/flutter/bin:$PATH && flutter config --enable-web && flutter pub get && flutter build web --release"
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
